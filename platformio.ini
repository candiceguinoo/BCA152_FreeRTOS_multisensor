[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
test_ignore = *

[env:native]
platform = native
build_flags = -DPIO_UNIT_TESTING
build_src_filter =
    -<*>
    +<alarm.cpp>
    +<input.cpp>
    +<system_state.cpp>
test_build_src = yes